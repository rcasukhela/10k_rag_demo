services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/code/data
      - ./artifacts:/code/artifacts
      - ./config:/code/config
      - ./models:/code/models
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3:270m
    command: uvicorn sec_rag.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped